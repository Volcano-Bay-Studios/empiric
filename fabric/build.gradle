plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation(include("foundry.veil:veil-fabric-${project.minecraft_version}:${project.veil_version}"))
    // ImGuiMC is optional: dev runs get it so the editor inspectors work
    modCompileOnly "foundry.imguimc:imguimc-fabric-${project.minecraft_version}:${project.imguimc_version}"
    modLocalRuntime "foundry.imguimc:imguimc-fabric-${project.minecraft_version}:${project.imguimc_version}"
    include(api("xyz.volcanobay:empiric-core:${project.empiric_core_version}"))
    modCompileOnly("dev.ryanhcode.sable:sable-fabric-${minecraft_version}:${sable_version}") {
        exclude group: "foundry.veil"
        transitive = false
    }
    if (!project.hasProperty('noSable')) {
        modLocalRuntime("dev.ryanhcode.sable:sable-fabric-${minecraft_version}:${sable_version}") {
            exclude group: "foundry.veil"
            transitive = false
        }
        // Loom strips Sable's nested jars when remapping it, so dev runs add them back
        modLocalRuntime("dev.ryanhcode.sable-companion:sable-companion-fabric-${minecraft_version}:${sable_companion_version}")
        localRuntime("dev.ryanhcode.sable:sable-sable_rapier-${minecraft_version}:${sable_version}") {
            transitive = false
        }
        modLocalRuntime("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}")
    }
    modCompileOnly("dev.ryanhcode.sable-companion:sable-companion-fabric-${minecraft_version}:${sable_companion_version}")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fuzs'
                url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
            }
        }
        filter { includeGroup('fuzs.forgeconfigapiport') }
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        gametest {
            server()
            setConfigName('Fabric Game Test')
            ideConfigGenerated(true)
            vmArg('-Dfabric-api.gametest')
            vmArg("-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/report.xml")
            runDir('build/gametest')
        }
        server {
            server()
            setConfigName('Fabric Server')
            programArgs('--nogui')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
